name: Release zj-loop-core

on:
  push:
    tags:
      - 'zj-loop-core-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. zj-loop-core-v0.1.30)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: tools/zj-loop-core/package-lock.json

      - name: Ensure npm supports provenance publishing
        run: npm install -g npm@10.9.8

      - name: Install, build, test
        working-directory: tools/zj-loop-core
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify published core runtime compatibility
        run: node scripts/validate-published-core-runtime.mjs --out published-core-runtime-result.json --json

      - name: Upload published core runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-core-runtime
          path: published-core-runtime-result.json

      - name: Summarize published core runtime evidence
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('published-core-runtime-result.json', 'utf8'));
          const lines = [
            '### Published core runtime',
            `- status: \`${x.status}\``,
            `- package: \`${x.package}@${x.requested_version}\``,
            `- registry: \`${x.registry}\``,
            ...x.checks.map((check) => `- ${check.id}: \`${check.status}\``),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\\n')}\\n`);
          NODE

      - name: Publish to npm
        working-directory: tools/zj-loop-core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
