<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZAgenticLoop OPN</title>
  <link rel="stylesheet" href="/assets/opn-ui.css">
</head>
<body>
  <header><a href="/">ZAgenticLoop</a><span id="status">连接中</span></header>
  <main>
    <section class="heading"><p>OPN CONNECTION</p><h1>设备协作状态</h1><div id="summary">正在读取本机连接...</div></section>
    <div id="error" class="error" role="alert" hidden></div>
    <section class="grid"><article><h2>本机节点</h2><dl id="local"></dl></article><article><h2>网络状态</h2><dl id="network"></dl></article></section>
    <section><div class="section-heading"><h2>参与节点</h2><button id="refresh" type="button">刷新</button></div><div id="peers" class="peers"></div></section>
  </main>
  <script src="/assets/opn-ui.js" defer></script>
</body>
</html>
